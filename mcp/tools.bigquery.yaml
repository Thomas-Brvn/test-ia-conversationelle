# Configuration MCP Toolbox for Databases (v1.15) — BigQuery
# Lancement : ./bin/toolbox --config mcp/tools.bigquery.yaml
# Endpoint MCP : http://127.0.0.1:5000/mcp
#
# ${GCP_PROJECT} est lu depuis les variables d'environnement.

kind: source
name: banque-bq
type: bigquery
project: ${GCP_PROJECT}
location: EU
writeMode: blocked            # lecture seule : seuls les SELECT passent
allowedDatasets:
  - banque_demo               # l'IA ne voit que ce dataset
maximumBytesBilled: 104857600 # 100 Mo max scannés par requête (garde-fou coût)
maxQueryResultRows: 200
---
# ---------- Outils génériques (exploration + SQL libre) ----------
kind: tool
name: lister_tables
type: bigquery-list-table-ids
source: banque-bq
description: Liste les tables disponibles dans le dataset banque_demo.
---
kind: tool
name: decrire_table
type: bigquery-get-table-info
source: banque-bq
description: Renvoie le schéma (colonnes, types) d'une table du dataset banque_demo.
---
kind: tool
name: executer_sql
type: bigquery-execute-sql
source: banque-bq
description: >
  Exécute une requête SQL SELECT (dialecte GoogleSQL / BigQuery) sur le dataset banque_demo.
  Préfixer les tables par banque_demo. (ex : banque_demo.clients).
  À utiliser seulement si aucun outil métier (kpi_*, fiche_client, depenses_*) ne répond à la question.
---
# ---------- Outils métier = couche sémantique exposée en MCP ----------
# Chaque indicateur est défini UNE fois ici, validé par le métier,
# et l'IA l'appelle au lieu de réinventer le calcul.
kind: tool
name: kpi_encours_par_agence
type: bigquery-sql
source: banque-bq
description: >
  Encours de dépôts (somme des soldes des comptes actifs) et encours de crédits
  (capital restant dû des crédits en cours ou impayés) pour chaque agence.
annotations:
  readOnlyHint: true   # SQL figé, en lecture seule (sinon Toolbox masque l'outil sur une source read-only)
statement: |
  WITH depots AS (
    SELECT cl.agence_id, SUM(co.solde) AS encours_depots, COUNT(DISTINCT co.client_id) AS nb_clients
    FROM banque_demo.comptes co JOIN banque_demo.clients cl USING (client_id)
    WHERE co.statut = 'actif'
    GROUP BY 1
  ), encours_credits AS (
    SELECT cl.agence_id, SUM(cr.capital_restant_du) AS encours_credits
    FROM banque_demo.credits cr JOIN banque_demo.clients cl USING (client_id)
    WHERE cr.statut IN ('en cours', 'impayé')
    GROUP BY 1
  )
  SELECT a.nom_agence, a.region, d.nb_clients,
         ROUND(d.encours_depots, 2) AS encours_depots,
         ROUND(COALESCE(c.encours_credits, 0), 2) AS encours_credits
  FROM banque_demo.agences a
  LEFT JOIN depots d USING (agence_id)
  LEFT JOIN encours_credits c USING (agence_id)
  ORDER BY encours_depots DESC
---
kind: tool
name: kpi_taux_impayes
type: bigquery-sql
source: banque-bq
description: >
  Taux d'impayés par type de crédit. Définition officielle : capital restant dû des crédits
  au statut 'impayé' divisé par le capital restant dû de tous les crédits actifs (en cours + impayé).
annotations:
  readOnlyHint: true   # SQL figé, en lecture seule (sinon Toolbox masque l'outil sur une source read-only)
statement: |
  SELECT type_credit,
         COUNT(*) AS nb_credits_actifs,
         SUM(CASE WHEN statut = 'impayé' THEN 1 ELSE 0 END) AS nb_impayes,
         ROUND(SUM(capital_restant_du), 2) AS encours,
         ROUND(100 * SUM(CASE WHEN statut = 'impayé' THEN capital_restant_du ELSE 0 END)
               / NULLIF(SUM(capital_restant_du), 0), 2) AS taux_impayes_pct
  FROM banque_demo.credits
  WHERE statut IN ('en cours', 'impayé')
  GROUP BY type_credit
  ORDER BY taux_impayes_pct DESC
---
kind: tool
name: depenses_par_categorie
type: bigquery-sql
source: banque-bq
description: >
  Total des dépenses (débits, montants négatifs) par catégorie pour un mois donné.
  Le résultat est exprimé en valeur positive.
parameters:
  - name: mois
    type: string
    description: Mois au format AAAA-MM, par exemple 2026-09.
annotations:
  readOnlyHint: true   # SQL figé, en lecture seule (sinon Toolbox masque l'outil sur une source read-only)
statement: |
  SELECT categorie,
         COUNT(*) AS nb_operations,
         ROUND(-SUM(montant), 2) AS total_depenses
  FROM banque_demo.transactions
  WHERE montant < 0 AND FORMAT_DATE('%Y-%m', date_operation) = @mois
  GROUP BY categorie
  ORDER BY total_depenses DESC
---
kind: tool
name: fiche_client
type: bigquery-sql
source: banque-bq
description: Vue 360° d'un client à partir de son identifiant (ex. CL00042) — profil, épargne, crédits.
parameters:
  - name: client_id
    type: string
    description: Identifiant client, format CL suivi de 5 chiffres.
annotations:
  readOnlyHint: true   # SQL figé, en lecture seule (sinon Toolbox masque l'outil sur une source read-only)
statement: |
  SELECT cl.client_id, cl.prenom, cl.nom, cl.segment, cl.score_risque, a.nom_agence,
         (SELECT ROUND(SUM(solde), 2) FROM banque_demo.comptes
           WHERE client_id = cl.client_id AND statut = 'actif' AND type_compte != 'Compte courant') AS epargne_totale,
         (SELECT ROUND(SUM(solde), 2) FROM banque_demo.comptes
           WHERE client_id = cl.client_id AND statut = 'actif' AND type_compte = 'Compte courant') AS solde_compte_courant,
         (SELECT ROUND(SUM(capital_restant_du), 2) FROM banque_demo.credits
           WHERE client_id = cl.client_id AND statut IN ('en cours', 'impayé')) AS encours_credits,
         (SELECT COUNT(*) FROM banque_demo.credits
           WHERE client_id = cl.client_id AND statut = 'impayé') AS nb_credits_impayes
  FROM banque_demo.clients cl JOIN banque_demo.agences a USING (agence_id)
  WHERE cl.client_id = @client_id
---
kind: toolset
name: banque
tools:
  - lister_tables
  - decrire_table
  - executer_sql
  - kpi_encours_par_agence
  - kpi_taux_impayes
  - depenses_par_categorie
  - fiche_client
